[finder]
# Where directories come from. Only "zoxide" is supported for now.
kind = "zoxide"

[finder.zoxide]
binary = "zoxide"

[multiplexer]
# Name or path of the zellij binary.
binary = "zellij"

[session]
# Number of trailing path components in session names, joined with "_": 1 gives "tobu", 2 gives "github.com_tobu".
name_depth = 1

# Programs started in a new session, each in its own tab, in this order. The first one has focus.
[[programs]]
binary = "nvim"
args = []

